# Netlify settings. No build step: the site is plain files in /public,
# and the two functions in /netlify/functions are bundled automatically.
[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "same-origin"
    X-Content-Type-Options = "nosniff"
    # Needed so the Google sign-in popup can report back to the page.
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
