function normaliseAnswer(s){if(s==null)return"";const t=String(s).toLowerCase().trim();if(NUM_WORDS[t]!==undefined)return String(NUM_WORDS[t]);return t;}
function levenshtein(a,b){const m=a.length,n=b.length;const dp=[];for(let i=0;i<=m;i++){dp[i]=[i];}for(let j=0;j<=n;j++){dp[0][j]=j;}for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);return dp[m][n];}
function fuzzyMatch(player,final2){const p=normaliseAnswer(player),f=normaliseAnswer(final2);if(!p||!f)return false;if(p===f)return true;return levenshtein(p,f)<=(f.length<=4?1:2);}
function countChangedKeys(oldObj,newObj){oldObj=oldObj||{};newObj=newObj||{};let n=0;Object.keys(newObj).forEach(k=>{if(JSON.stringify(oldObj[k])!==JSON.stringify(newObj[k]))n++;});return n;}

function notify(msg,icon="🏴󠁧󠁢󠁥󠁮󠁧󠁿"){const existing=document.getElementById("toast");if(existing)existing.remove();const t=document.createElement("div");t.id="toast";t.className="toast";t.innerHTML=`<span>${icon}</span><span>${msg}</span>`;document.body.appendChild(t);setTimeout(()=>{if(t.parentNode)t.parentNode.removeChild(t);},2800);}

function calcScore(username){
  let pts=0;const p=S.players[username];if(!p)return 0;
  const preds=p.predictions||{};
  ALL_MATCHES.forEach(m=>{
    const res=S.results[m.id],pred=preds[m.id];if(!res)return;
    const pH=pred?parseInt(pred.home):NaN,pA=pred?parseInt(pred.away):NaN;
    if(isNaN(pH)||isNaN(pA))return;
    const rH=parseInt(res.home),rA=parseInt(res.away);if(isNaN(rH)||isNaN(rA))return;
    const rR=rH>rA?"H":rH<rA?"A":"D",pR=pH>pA?"H":pH<pA?"A":"D";
    if(rR===pR){pts+=S.rules.correctResult;if(rH===pH&&rA===pA)pts+=S.rules.exactScore;if(rR!=="D"&&(rR==="H"?m.home:m.away)===dog(m.home,m.away))pts+=S.rules.underdog;}
  });
  const myKoPreds=S.koPreds[username]||{};
  KO_FIXTURES.forEach(sec=>sec.matches.forEach(fx=>{
    const res=S.koRes[fx.id];if(!res||!res.score)return;
    const pred=myKoPreds[fx.id];if(!pred)return;
    const sc=res.score.split("(")[0].trim().split("-");if(sc.length<2)return;
    const rH=parseInt(sc[0]),rA=parseInt(sc[1]),pH=parseInt(pred.home),pA=parseInt(pred.away);
    if(isNaN(rH)||isNaN(rA)||isNaN(pH)||isNaN(pA))return;
    const rR=rH>rA?"H":rH<rA?"A":"D",pR=pH>pA?"H":pH<pA?"A":"D";
    if(rR===pR){
      pts+=S.rules.correctResult;
      if(rH===pH&&rA===pA)pts+=S.rules.exactScore;
      if(rR!=="D"&&res.home&&res.away){const w=rR==="H"?res.home:res.away;if(w===dog(res.home,res.away))pts+=S.rules.underdog;}
      // Pens bonus: predicted draw + correct team through
      if(rR==="D"&&pred.penWinner&&res.penWinner&&pred.penWinner===res.penWinner)pts+=(S.rules.penWinner||2);
    }
  }));
  S.wcs.forEach(wc=>{
    const manual=S.wcManualResults[wc.id]&&S.wcManualResults[wc.id][username];
    if(manual===true){pts+=wc.points;return;}if(manual===false)return;
    const fa=S.wcFinalAnswers[wc.id];if(!fa)return;
    const ur=S.wcResponses[wc.id]&&S.wcResponses[wc.id][username];if(!ur)return;
    const accepted=fa.split(",").map(s=>s.trim()).filter(Boolean);
    if(accepted.some(a=>fuzzyMatch(ur,a)))pts+=wc.points;
  });
  (S.wcAwards[username]||[]).forEach(wid=>{const wc=S.wcs.find(w=>w.id===wid);if(wc&&!S.wcFinalAnswers[wc.id])pts+=wc.points;});
  return pts;
}

function getLeaderboard(){
  return Object.keys(S.players)
    .filter(u=>u!=="__admin__"&&S.players[u]&&S.players[u].teamName)
    .map(u=>({username:u,teamName:S.players[u].teamName,pts:calcScore(u)}))
    .sort((a,b)=>b.pts-a.pts);
}

function snapshotRanksIfChanged(eventLabel){
  const lb=getLeaderboard();const newRanks={};lb.forEach((p,i)=>{newRanks[p.username]=i+1;});
  if(Object.keys(S.prevRanks).length===0){S.prevRanks=newRanks;return;}
  const moves={};
  lb.forEach((p,i)=>{const newRank=i+1,oldRank=S.prevRanks[p.username];if(oldRank!=null&&oldRank!==newRank)moves[p.username]={delta:oldRank-newRank};});
  S.rankMoveExpiry=moves;S.prevRanks=newRanks;
  if(eventLabel)S.lastScoringEvent={label:eventLabel,at:Date.now()};
}
function getActiveRankMove(username){const m=S.rankMoveExpiry[username];return m?m.delta:null;}

// ── Group standings ───────────────────────────────────────────────────────
function calcGroupStandings(group){
  const teams=GROUPS[group].slice();
  const st={};teams.forEach(t=>{st[t]={pts:0,gd:0,gf:0};});
  ALL_MATCHES.filter(m=>m.group===group).forEach(m=>{
    const res=S.results[m.id];if(!res)return;
    const rH=parseInt(res.home),rA=parseInt(res.away);if(isNaN(rH)||isNaN(rA))return;
    st[m.home].gf+=rH;st[m.home].gd+=rH-rA;st[m.away].gf+=rA;st[m.away].gd+=rA-rH;
    if(rH>rA)st[m.home].pts+=3;else if(rH<rA)st[m.away].pts+=3;else{st[m.home].pts++;st[m.away].pts++;}
  });
  return teams.sort((a,b)=>(st[b].pts-st[a].pts)||(st[b].gd-st[a].gd)||(st[b].gf-st[a].gf));
}

function groupMatchesComplete(group){
  const gm=ALL_MATCHES.filter(m=>m.group===group);
  return gm.length>0&&gm.every(m=>!!S.results[m.id]);
}

// ── KO bracket progression map ────────────────────────────────────────────
// For each match, defines which two feeder matches produce its home/away teams
// winner of feeder home slot → home team, winner of feeder away slot → away team
const KO_PROGRESSION={
  // R16: winners of R32 pairs
  "R16_1":{home:"R32_1",away:"R32_2"},
  "R16_2":{home:"R32_3",away:"R32_4"},
  "R16_3":{home:"R32_5",away:"R32_6"},
  "R16_4":{home:"R32_7",away:"R32_8"},
  "R16_5":{home:"R32_9", away:"R32_10"},
  "R16_6":{home:"R32_11",away:"R32_12"},
  "R16_7":{home:"R32_13",away:"R32_14"},
  "R16_8":{home:"R32_15",away:"R32_16"},
  // QF: winners of R16 pairs
  "QF_1":{home:"R16_1",away:"R16_2"},
  "QF_2":{home:"R16_3",away:"R16_4"},
  "QF_3":{home:"R16_5",away:"R16_6"},
  "QF_4":{home:"R16_7",away:"R16_8"},
  // SF: winners of QF pairs
  "SF_1":{home:"QF_1",away:"QF_2"},
  "SF_2":{home:"QF_3",away:"QF_4"},
  // Final: winners of SFs
  "F_1":{home:"SF_1",away:"SF_2"},
};

// Get the winner of a KO match from koRes
function getKoWinner(fxId,koRes){
  const d=koRes[fxId];if(!d)return null;
  if(d.winner)return d.winner;
  // Derive from score if winner not explicitly set
  if(d.score){
    const sc=d.score.split("(")[0].trim().split("-");
    const rH=parseInt(sc[0]),rA=parseInt(sc[1]);
    if(!isNaN(rH)&&!isNaN(rA)){
      if(rH>rA)return d.home;
      if(rA>rH)return d.away;
      // Draw after 90 — use penWinner
      if(d.penWinner)return d.penWinner;
    }
  }
  return null;
}

// Propagate KO winners into subsequent round slots
async function propagateKoBracket(){
  const newKo={...S.koRes};
  let changed=0;
  Object.entries(KO_PROGRESSION).forEach(([fxId,feeders])=>{
    const homeWinner=getKoWinner(feeders.home,newKo);
    const awayWinner=getKoWinner(feeders.away,newKo);
    if(!homeWinner&&!awayWinner)return;
    const existing=newKo[fxId]||{};
    const newHome=homeWinner||existing.home||null;
    const newAway=awayWinner||existing.away||null;
    // homeLocked/awayLocked = true once the feeder match has a confirmed winner
    const homeLocked=!!homeWinner;
    const awayLocked=!!awayWinner;
    if(newHome!==existing.home||newAway!==existing.away||existing.homeLocked!==homeLocked||existing.awayLocked!==awayLocked){
      newKo[fxId]={...existing,home:newHome,away:newAway,homeLocked,awayLocked,winner:existing.winner||null,score:existing.score||null,penWinner:existing.penWinner||null};
      changed++;
    }
  });
  if(changed>0){
    S.koRes=newKo;
    await sSet(SK.koResults,newKo);
    render();
    notify(changed+" KO slot"+(changed===1?"":"s")+" updated from results","🏆");
  }
  return changed;
}
const R32_SEEDS=[
  {id:"R32_1",home:["A",0],away:["B",1]},{id:"R32_2",home:["C",0],away:["D",1]},
  {id:"R32_3",home:["E",0],away:["F",1]},{id:"R32_4",home:["G",0],away:["H",1]},
  {id:"R32_5",home:["I",0],away:["J",1]},{id:"R32_6",home:["K",0],away:["L",1]},
  {id:"R32_7",home:["B",0],away:["A",1]},{id:"R32_8",home:["D",0],away:["C",1]},
  {id:"R32_9",home:["F",0],away:["E",1]},{id:"R32_10",home:["H",0],away:["G",1]},
  {id:"R32_11",home:["J",0],away:["I",1]},{id:"R32_12",home:["L",0],away:["K",1]},
  {id:"R32_13",home:["A",0],away:["C",1]},{id:"R32_14",home:["B",0],away:["D",1]},
  {id:"R32_15",home:["E",0],away:["G",1]},{id:"R32_16",home:["F",0],away:["H",1]},
];

async function deriveAndSaveR32(){
  const newKo={...S.koRes};let changed=0;
  R32_SEEDS.forEach(seed=>{
    const[hGrp,hPos]=seed.home,[aGrp,aPos]=seed.away;
    const hDone=groupMatchesComplete(hGrp),aDone=groupMatchesComplete(aGrp);
    const hStandings=calcGroupStandings(hGrp),aStandings=calcGroupStandings(aGrp);
    const homeTeam=hStandings[hPos]||null,awayTeam=aStandings[aPos]||null;
    if(!homeTeam&&!awayTeam)return;
    const existing=newKo[seed.id]||{};
    const newHome=homeTeam||existing.home||null,newAway=awayTeam||existing.away||null;
    if(newHome!==existing.home||newAway!==existing.away||existing.homeLocked!==hDone||existing.awayLocked!==aDone){
      newKo[seed.id]={...existing,home:newHome,away:newAway,homeLocked:hDone,awayLocked:aDone,winner:existing.winner||null,score:existing.score||null};
      changed++;
    }
  });
  if(changed>0){S.koRes=newKo;await sSet(SK.koResults,newKo);render();notify(changed+" R32 slot"+(changed===1?"":"s")+" updated","🏆");}
  return changed;
}

async function init(){
  const[pl,res,rul,wc,wca,ko,kor,wcr,wcf,wcl,lck,pul,wmr]=await Promise.all([
    loadAllPlayers(),sGet(SK.results,{}),sGet(SK.rules,DEFAULT_RULES),
    sGet(SK.wildcards,[]),sGet(SK.wcAwards,{}),sGet(SK.koResults,{}),sGet(SK.koRound,0),
    sGet(SK.wcResponses,{}),sGet(SK.wcFinalAnswers,{}),sGet(SK.wcLiveStats,{}),sGet(SK.locks,{}),
    sGet(SK.playerUnlocks,{}),sGet("wcManualResults",{}),
  ]);
  const allUsers=Object.keys(pl).filter(u=>u!=="__admin__");
  const koPredEntries=await Promise.all(allUsers.map(async u=>{const d=await sGet(SK.koPredKey(u),null);return d?[u,d]:null;}));
  const koPreds={};koPredEntries.forEach(e=>{if(e)koPreds[e[0]]=e[1];});
  setState({players:pl,results:res,rules:rul,wcs:wc,wcAwards:wca,koRes:ko,koRound:kor,
    wcResponses:wcr,wcFinalAnswers:wcf,wcLiveStats:wcl,locks:lck,playerUnlocks:pul,wcManualResults:wmr,koPreds,loaded:true},true);
  snapshotRanksIfChanged();
  await deriveAndSaveR32();
  await propagateKoBracket();
  render();
  startListeners();
}

const activeListeners=[];
function stopListeners(){activeListeners.forEach(u=>u());activeListeners.length=0;}
function startListeners(){
  stopListeners();
  const listen=(key,onNew)=>{
    const unsub=onSnapshot(doc(db,COL,key),snap=>{const val=snap.exists()?JSON.parse(snap.data().v):null;if(val!==null)onNew(val);},err=>console.warn("listener error",key,err));
    activeListeners.push(unsub);
  };
  listen(SK.results,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.results))return;S.results=val;render();});
  listen(SK.locks,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.locks))return;S.locks=val;render();});
  listen(SK.playerUnlocks,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.playerUnlocks))return;S.playerUnlocks=val;render();});
  listen("wcManualResults",val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.wcManualResults))return;S.wcManualResults=val;render();});
  listen(SK.koResults,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.koRes))return;S.koRes=val;render();});
  listen(SK.wcResponses,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.wcResponses))return;S.wcResponses=val;render();});
  listen(SK.wcFinalAnswers,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.wcFinalAnswers))return;S.wcFinalAnswers=val;render();});
  listen(SK.wcAwards,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.wcAwards))return;S.wcAwards=val;render();});
  listen(SK.wildcards,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.wcs))return;S.wcs=val;render();});
  listen(SK.rules,val=>{if(!S.liveRefresh||JSON.stringify(val)===JSON.stringify(S.rules))return;S.rules=val;render();});
  listen(SK.registry,async val=>{
    if(!S.liveRefresh)return;
    const newUsers=Object.keys(val).filter(u=>u!=="__admin__"&&!S.players[u]);if(newUsers.length===0)return;
    const entries=await Promise.all(newUsers.map(async u=>{const d=await sGet(SK.playerKey(u),null);return d?[u,d]:null;}));
    const extra={};entries.forEach(e=>{if(e)extra[e[0]]=e[1];});
    if(Object.keys(extra).length>0){S.players={...S.players,...extra};render();}
  });
}

function el(tag,attrs={},kids=[]){
  const e=document.createElement(tag);
  for(const[k,v] of Object.entries(attrs)){
    if(k==="className")e.className=v;
    else if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(["disabled","checked"].includes(k)){if(v)e.setAttribute(k,"");}
    else e.setAttribute(k,v);
  }
  for(const k of kids){if(k==null)continue;e.appendChild(typeof k==="string"||typeof k==="number"?document.createTextNode(String(k)):k);}
  return e;
}
function safePred(u,matchId){const p=S.players[u];return p&&p.predictions?p.predictions[matchId]:undefined;}

function kitBadge(team,size=44){
  const k=kit(team),w=Math.round(size*0.85);
  const initials=team.split(" ").map(x=>x[0]).join("").slice(0,3).toUpperCase();
  const wrap=div({style:{width:w+"px",height:size+"px",borderRadius:"7px",overflow:"hidden",position:"relative",flexShrink:"0",boxShadow:"0 2px 8px rgba(0,0,0,0.15)"}});
  wrap.innerHTML=`<div style="position:absolute;inset:0;background:${k.p}"></div><div style="position:absolute;top:0;left:0;right:0;height:${Math.round(size*0.18)}px;background:${k.s};opacity:0.85"></div><div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-top:${Math.round(size*0.1)}px"><span style="font-size:${Math.round(w*0.28)}px;font-weight:900;color:${k.t}">${initials}</span></div><div style="position:absolute;inset:0;border-radius:7px;border:1px solid rgba(0,0,0,0.12)"></div>`;
  return wrap;
}

function render(){
  const root=document.getElementById("root");if(!root)return;
  let styleEl=document.getElementById("app-style");
  if(!styleEl){styleEl=document.createElement("style");styleEl.id="app-style";document.head.appendChild(styleEl);}
  styleEl.textContent=CSS;
  root.innerHTML="";
  const app=div({className:"app"});
  if(!S.loaded){app.appendChild(loadingScreen());root.appendChild(app);return;}
  if(S.view==="login"){app.appendChild(renderLogin());}
  else{
    app.appendChild(renderTopBar());
    const content=div({className:"fade",style:{padding:"16px 16px 0"}});
    if(S.view==="predict")content.appendChild(renderPredict());
    else if(S.view==="schedule")content.appendChild(renderSchedule());
    else if(S.view==="bracket")content.appendChild(renderBracket());
    else if(S.view==="leaderboard")content.appendChild(renderLeaderboard());
    else if(S.view==="wildcards")content.appendChild(renderWildcards());
    else if(S.view==="admin"&&S.adminAuth)content.appendChild(renderAdmin());
    app.appendChild(content);
  }
  root.appendChild(app);
}

async function handleJoin(){
  const uTrim=getVal("login-name").trim(),tTrim=getVal("login-team").trim();
  const code=getVal("login-code").trim(),pin=getVal("login-pin").trim();
  if(!uTrim){notify("Enter your name first!","❌");return;}
  if(!tTrim){notify("Enter a team name!","❌");return;}
  const normUser=uTrim.toLowerCase();
  const matchedKey=Object.keys(S.players).find(k=>k.toLowerCase()===normUser&&k!=="__admin__");
  const isReturning=!!matchedKey;
  if(isReturning){
    if(!pin){notify("Enter your 2-digit PIN!","❌");return;}
    if(pin!==S.players[matchedKey].pin){notify("Wrong PIN — check with Lewis!","❌");return;}
    const updated={...S.players[matchedKey],teamName:tTrim};
    const myKoPreds=await sGet(SK.koPredKey(matchedKey),{});
    setState({players:{...S.players,[matchedKey]:updated},cu:matchedKey,koPreds:{...S.koPreds,[matchedKey]:myKoPreds},view:"predict"});
    notify(tTrim+" is back! 🦁");
    savePlayerData(matchedKey,updated);
    if(tTrim!==S.players[matchedKey].teamName)updateRegistry(matchedKey,tTrim);
  } else {
    if(!code){notify("Enter the office code (ask Lewis)!","❌");return;}
    if(code!==OFFICE_CODE){notify("Wrong office code — ask Lewis!","❌");return;}
    const newPin=String(10+Math.floor(Math.random()*90));
    const newEntry={teamName:tTrim,predictions:{},pin:newPin};
    setState({players:{...S.players,[uTrim]:newEntry},cu:uTrim,loginPinModal:{pin:newPin,teamName:tTrim}});
    registerPlayer(uTrim,newEntry).then(async()=>{const refreshed=await loadAllPlayers();setState({players:refreshed},true);});
  }
}

function handleAdmin(){
  const pin=getVal("admin-pin").trim();

  else notify("Wrong admin PIN!","❌");

function renderPredict(){
  const gsGlobalLocked=!!S.locks.groupStage;
  const gsOverride=!!(S.playerUnlocks[S.cu]&&S.playerUnlocks[S.cu].groupStage);
  const gsLocked=gsGlobalLocked&&!gsOverride;
  const preds=(S.players[S.cu]&&S.players[S.cu].predictions)||{};
  const myKoPreds=S.koPreds[S.cu]||{};
  const done=ALL_MATCHES.filter(m=>{const p=preds[m.id];return p&&parseInt(p.home)>=0&&parseInt(p.away)>=0&&!isNaN(parseInt(p.home))&&!isNaN(parseInt(p.away));}).length;
  const openKoRounds=KO_FIXTURES.filter(sec=>sec.matches.some(fx=>S.koRes[fx.id]&&S.koRes[fx.id].home)).map(sec=>sec.round);
  const wrap=div({});
  if(gsLocked){const lb=div({className:"lock-banner"});lb.innerHTML=`<span style="font-size:28px">🔒</span><div><div style="color:#fff;font-weight:800;font-size:16px">Group Stage Picks Are Locked</div><div style="color:rgba(255,255,255,0.8);font-size:12px;margin-top:2px">The tournament has started.</div></div>`;wrap.appendChild(lb);}
  else if(gsGlobalLocked&&gsOverride){const lb=div({className:"lock-banner",style:{background:"#15803d"}});lb.innerHTML=`<span style="font-size:28px">🔓</span><div><div style="color:#fff;font-weight:800;font-size:16px">You've Been Given Special Access</div><div style="color:rgba(255,255,255,0.85);font-size:12px;margin-top:2px">Group stage picks are locked for everyone else, but you can still edit yours.</div></div>`;wrap.appendChild(lb);}
  const two=div({style:{display:"grid",gridTemplateColumns:"3fr 1fr",gap:"24px",padding:"16px 16px 0",alignItems:"start"}});const left=div({});
  const ph=div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"4px"}});
  ph.appendChild(span({style:{fontWeight:"700",fontSize:"15px"}},["Your Predictions"]));
  ph.appendChild(span({className:"bdg-r"},[done+"/"+ALL_MATCHES.length+" group"]));
  left.appendChild(ph);
  const pb=div({className:"pbar"});pb.appendChild(div({className:"pfill",style:{width:Math.round(done/ALL_MATCHES.length*100)+"%"}}));left.appendChild(pb);
  left.appendChild(div({style:{fontSize:"10px",color:"#8e8e93",marginBottom:"16px"}},["Picks lock when admin closes · Underdog bonus from FIFA rankings"]));
  const rtabs=div({style:{display:"flex",gap:"6px",marginBottom:"14px",flexWrap:"wrap"}});
  const mkRtab=(label,active,onClick)=>btn({style:{padding:"5px 14px",borderRadius:"20px",border:`1px solid ${active?"#C8102E":"#e5e5e7"}`,background:active?"#C8102E":"transparent",color:active?"#fff":"#6e6e73",fontSize:"12px",fontWeight:"600",cursor:"pointer"},onClick},[label]);
  rtabs.appendChild(mkRtab("⚽ Group Stage"+(gsLocked?" 🔒":""),S.predictKoTab===null,()=>setState({predictKoTab:null})));
  openKoRounds.forEach(rnd=>rtabs.appendChild(mkRtab((S.locks[rnd]?"🔒 ":"")+rnd,S.predictKoTab===rnd,()=>setState({predictKoTab:rnd}))));
  left.appendChild(rtabs);
  if(S.predictKoTab===null){
    const gt=div({className:"gtabs"});
    Object.keys(GROUPS).forEach(g=>gt.appendChild(btn({className:"gtab"+(S.predictGrp===g?" on":""),onClick:()=>setState({predictGrp:g})},["Group "+g])));
    left.appendChild(gt);
    ALL_MATCHES.filter(m=>m.group===S.predictGrp).forEach(m=>left.appendChild(matchCard(m,preds,gsLocked,gsOverride)));
  } else {
    const sec=KO_FIXTURES.find(s=>s.round===S.predictKoTab);
    const koGlobalLocked=!!S.locks[S.predictKoTab];
    const koOverride=!!(S.playerUnlocks[S.cu]&&S.playerUnlocks[S.cu][S.predictKoTab]);
    const koLocked=koGlobalLocked&&!koOverride;
    if(koLocked)left.appendChild(div({style:{background:"rgba(239,68,68,0.07)",border:"1px solid rgba(239,68,68,0.2)",borderRadius:"12px",padding:"10px 14px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"8px"}},[span({style:{fontSize:"16px"}},["🔒"]),span({style:{fontSize:"13px",fontWeight:"600",color:"#dc2626"}},[S.predictKoTab+" picks are locked"])]));
    else if(koGlobalLocked&&koOverride)left.appendChild(div({style:{background:"rgba(22,163,74,0.07)",border:"1px solid rgba(22,163,74,0.2)",borderRadius:"12px",padding:"10px 14px",marginBottom:"14px",display:"flex",alignItems:"center",gap:"8px"}},[span({style:{fontSize:"16px"}},["🔓"]),span({style:{fontSize:"13px",fontWeight:"600",color:"#15803d"}},["You have special access to edit "+S.predictKoTab+" picks"])]));

    // Split matches into left half / right half of draw
    const allFx=sec?sec.matches:[];
    const half=Math.ceil(allFx.length/2);
    const leftFx=allFx.slice(0,half);
    const rightFx=allFx.slice(half);

    // Two-column grid header
    if(allFx.length>1){
      const splitHdr=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px",marginBottom:"6px"}});
      splitHdr.appendChild(div({style:{fontSize:"11px",fontWeight:"700",color:"#8e8e93",textTransform:"uppercase",letterSpacing:"0.5px",textAlign:"center",padding:"4px 0",background:"rgba(200,16,46,0.06)",borderRadius:"8px"}},["◀ Left side of draw"]));
      splitHdr.appendChild(div({style:{fontSize:"11px",fontWeight:"700",color:"#8e8e93",textTransform:"uppercase",letterSpacing:"0.5px",textAlign:"center",padding:"4px 0",background:"rgba(200,16,46,0.06)",borderRadius:"8px"}},["Right side of draw ▶"]));
      left.appendChild(splitHdr);

      const koGrid=div({style:{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"10px"}});
      const maxRows=Math.max(leftFx.length,rightFx.length);
      for(let i=0;i<maxRows;i++){

        if(i<leftFx.length){
          const fx=leftFx[i];

        } else {
          koGrid.appendChild(div({}));
        }
        // Right column card
        if(i<rightFx.length){
          const fx=rightFx[i];
          const lr=S.koRes[fx.id];
          if(lr&&lr.home){koGrid.appendChild(koMatchCard(fx,lr,myKoPreds,koLocked,S.predictKoTab));}
          else{koGrid.appendChild(div({style:{borderRadius:"16px",border:"1px dashed #e5e5e7",padding:"20px 12px",display:"flex",alignItems:"center",justifyContent:"center",color:"#aaa",fontSize:"12px",fontWeight:"600",background:"#fafafa"}},["⏳ Teams TBD"]));}
        } else {
          koGrid.appendChild(div({}));
        }
      }
      left.appendChild(koGrid);
    } else {
      // Final — single match, full width
      allFx.forEach(fx=>{const lr=S.koRes[fx.id];if(!lr||!lr.home)return;left.appendChild(koMatchCard(fx,lr,myKoPreds,koLocked,S.predictKoTab));});

  }
  two.appendChild(left);
  const right=div({});
  const rp=div({className:"col-panel"});
  rp.appendChild(div({className:"col-panel-title"},["Scoring Rules"]));
  [{icon:"✓",l:"Correct result",p:S.rules.correctResult},{icon:"⭐",l:"Exact scoreline",p:S.rules.exactScore},{icon:"⚡",l:"Underdog win",p:S.rules.underdog},{icon:"⚽",l:"Pens winner (KO)",p:S.rules.penWinner||2}].forEach(r=>{
    rp.appendChild(div({style:{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"8px 10px",background:"#fff",borderRadius:"10px",marginBottom:"6px"}},[span({style:{fontSize:"13px",color:"#6e6e73"}},[r.icon+" "+r.l]),span({style:{fontWeight:"700",color:"#C8102E",fontSize:"14px"}},["+"+r.p+" pts"])]));
  });
  right.appendChild(rp);
  if(S.predictKoTab===null){
    const gp=div({className:"col-panel"});
    gp.appendChild(div({className:"col-panel-title"},["Group "+S.predictGrp+" Standings"]));
    const teams=GROUPS[S.predictGrp].slice(),pts={},gd={};
    teams.forEach(t=>{pts[t]=0;gd[t]=0;});
    ALL_MATCHES.filter(m=>m.group===S.predictGrp).forEach(m=>{
      const res=S.results[m.id];if(!res)return;
      const rH=parseInt(res.home),rA=parseInt(res.away);if(isNaN(rH)||isNaN(rA))return;
      gd[m.home]+=rH-rA;gd[m.away]+=rA-rH;
      if(rH>rA)pts[m.home]+=3;else if(rH<rA)pts[m.away]+=3;else{pts[m.home]++;pts[m.away]++;}
    });
    teams.sort((a,b)=>(pts[b]-pts[a])||((gd[b]||0)-(gd[a]||0))).forEach((t,i)=>{
      gp.appendChild(div({style:{display:"flex",alignItems:"center",gap:"8px",padding:"7px 10px",background:"#fff",borderRadius:"10px",marginBottom:"5px"}},[span({style:{fontSize:"11px",fontWeight:"700",color:i<2?"#C8102E":"#8e8e93",minWidth:"16px"}},[i+1]),span({style:{fontSize:"16px"}},[fl(t)]),span({style:{fontSize:"12px",flex:"1",fontWeight:"500"}},[t]),span({style:{fontSize:"11px",color:"#8e8e93",marginRight:"4px"}},["GD "+(gd[t]>=0?"+":"")+gd[t]]),span({style:{fontWeight:"700",fontSize:"13px",color:"#C8102E"}},[pts[t]+" pts"])]));
    });
    right.appendChild(gp);
  }
  two.appendChild(right);wrap.appendChild(two);return wrap;
}

function personalResultBadge(home,away,resHome,resAway,getPred){
  const pred=(S.players[S.cu]?getPred(S.cu):null)||{};
  const hasPred=pred.home!==undefined&&pred.home!==""&&pred.away!==undefined&&pred.away!=="";
  const pH=hasPred?parseInt(pred.home):NaN,pA=hasPred?parseInt(pred.away):NaN;
  const validPred=hasPred&&!isNaN(pH)&&!isNaN(pA);
  const rR=resHome>resAway?"H":resHome<resAway?"A":"D";
  const pR=validPred?(pH>pA?"H":pH<pA?"A":"D"):null;
  const isCorrect=validPred&&pR===rR;
  const isExact=isCorrect&&pH===resHome&&pA===resAway;
  const d2=dog(home,away);
  const actualWinner=rR==="H"?home:rR==="A"?away:null;
  const gotDog=isCorrect&&rR!=="D"&&actualWinner===d2;
  let pts=0;
  if(isCorrect){pts+=S.rules.correctResult;if(isExact)pts+=S.rules.exactScore;if(gotDog)pts+=S.rules.underdog;}
  if(!validPred)return{label:"No pick",color:"#8e8e93",bg:"#f5f5f7"};
  if(isExact)return{label:"⭐ +"+pts+(gotDog?" ⚡":""),color:"#15803d",bg:"rgba(22,163,74,0.12)"};
  if(isCorrect)return{label:"✓ +"+pts+(gotDog?" ⚡":""),color:"#1d4ed8",bg:"rgba(59,130,246,0.12)"};
  return{label:"✗ 0pts",color:"#dc2626",bg:"rgba(239,68,68,0.1)"};
}

function koMatchCard(fx,lr,myKoPreds,koLocked,roundLabel){
  const pred=myKoPreds[fx.id]||{home:"",away:"",penWinner:""};
  const d2=dog(lr.home,lr.away);
  const scoreStr=lr.score?(lr.score.split("(")[0].trim()):null;

  const correct=rR&&pR&&rR===pR,exact=correct&&rH===pH&&rA===pA;

  if(koLocked&&rH!==null&&!isNaN(rH)){

    const badge=personalResultBadge(lr.home,lr.away,rH,rA,getPred);

    mid.appendChild(pill);
    mid.appendChild(div({style:{fontSize:"9px",color:"#8e8e93",fontWeight:"700"}},["Final: "+rH+"–"+rA+" · 👆"]));
    // Show pen winner result if applicable
    if(rR==="D"&&lr.penWinner){
      const penCorrect=pred.penWinner===lr.penWinner;
      const penLine=div({style:{fontSize:"10px",fontWeight:"700",padding:"2px 8px",borderRadius:"8px",background:penCorrect?"rgba(22,163,74,0.1)":"rgba(239,68,68,0.08)",color:penCorrect?"#15803d":"#dc2626"}});
      penLine.textContent=(penCorrect?"⚽ +2pts · ":"❌ ")+(lr.penWinner)+" through on pens"+(pred.penWinner&&!penCorrect?" (you picked "+pred.penWinner+")":"");

    }
  } else if(koLocked){
    mid.appendChild(div({style:{fontWeight:"700",fontSize:"17px",color:"#6e6e73",letterSpacing:"2px"}},[(pred.home||"–")+" – "+(pred.away||"–")]));

      i.addEventListener("keydown",e=>{if(e.key==="-"||e.key==="e"||e.key==="+")e.preventDefault();});

        const myPreds=S.koPreds[S.cu]||{};

        // Clear penWinner if score is no longer a draw
        const cur=next[fx.id];

          S.koPreds={...S.koPreds,[S.cu]:next};
          debounced("saveKo_"+fx.id,()=>sSet(SK.koPredKey(S.cu),next));
          render();
        }});
        pb.appendChild(span({},[ fl(team) ]));

      mid.appendChild(span({className:"pill-dog"},["⚡ "+d2+" upset bonus"]));
    }
  }

  mid.appendChild(div({style:{fontSize:"9px",color:"#8e8e93",marginTop:"2px"}},[fx.date]));
  row.appendChild(mid);row.appendChild(teamCol(lr.away));body.appendChild(row);

  if(koLocked&&pR){
    const lr2=div({className:"lock-row"});lr2.appendChild(span({},"🔒"));
    if(exact)lr2.appendChild(span({className:"rb rb-ex"},["⭐ Exact"]));
    else if(correct)lr2.appendChild(span({className:"rb rb-ok"},["✓ Result"]));
    else if(rR)lr2.appendChild(span({className:"rb rb-no"},["✗ Miss"]));
    if(penBonus)lr2.appendChild(span({className:"rb rb-ok"},["⚽ Pens +2"]));
    body.appendChild(lr2);
  }
  card.appendChild(body);return card;
}

// ── SVG Overview bracket (mirrored left/right) ────────────────────────────
function renderBracketSVG(){
  const CARD_W=200,CARD_H=62,SLOT_H=80,PAD_X=12,PAD_Y=52,COL_GAP=44;
  const ROUNDS_L=[
    {ids:["R32_1","R32_2","R32_3","R32_4","R32_5","R32_6","R32_7","R32_8"]},
    {ids:["R16_1","R16_2","R16_3","R16_4"]},
    {ids:["QF_1","QF_2"]},
    {ids:["SF_1"]},
  ];
  const ROUNDS_R=[
    {ids:["R32_9","R32_10","R32_11","R32_12","R32_13","R32_14","R32_15","R32_16"]},
    {ids:["R16_5","R16_6","R16_7","R16_8"]},
    {ids:["QF_3","QF_4"]},
    {ids:["SF_2"]},
  ];
  const totalH=PAD_Y+16*SLOT_H+52;
  const halfW=PAD_X+4*(CARD_W+COL_GAP);
  const finalX=halfW+COL_GAP/2;
  const totalW=halfW*2+COL_GAP+CARD_W;
  const NS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(NS,"svg");
  svg.setAttribute("viewBox",`0 0 ${totalW} ${totalH}`);
  svg.setAttribute("width","100%");
  svg.setAttribute("preserveAspectRatio","xMidYMid meet");
  svg.style.cssText="display:block;min-width:900px";

  const mkT=(x,y,t,a={})=>{const e=document.createElementNS(NS,"text");e.setAttribute("x",x);e.setAttribute("y",y);e.textContent=t;Object.entries({...a,"font-family":"Inter,system-ui,sans-serif"}).forEach(([k,v])=>e.setAttribute(k,v));return e;};
  const mkR=(x,y,w,h,a={})=>{const r=document.createElementNS(NS,"rect");r.setAttribute("x",x);r.setAttribute("y",y);r.setAttribute("width",w);r.setAttribute("height",h);Object.entries(a).forEach(([k,v])=>r.setAttribute(k,v));return r;};
  const mkL=(x1,y1,x2,y2,col="#e0e0e0",sw="1.5")=>{const l=document.createElementNS(NS,"line");[["x1",x1],["y1",y1],["x2",x2],["y2",y2],["stroke",col],["stroke-width",sw]].forEach(([k,v])=>l.setAttribute(k,v));return l;};

  const colXL=ci=>PAD_X+ci*(CARD_W+COL_GAP);
  const colXR=ci=>totalW-PAD_X-CARD_W-ci*(CARD_W+COL_GAP);
  const matchCY=(ci,mi,side)=>{
    const count=(side==="L"?ROUNDS_L:ROUNDS_R)[ci].ids.length;
    const step=(16*SLOT_H)/count;
    return PAD_Y+step*mi+step/2;
  };

  // Round label background pills
  const RLABELS=["Round of 32","Round of 16","Quarter-finals","Semi-finals"];
  const RSHORT=["R32","R16","QF","SF"];
  RLABELS.forEach((lbl,ci)=>{
    const lx=colXL(ci),rx=colXR(ci);
    const pw=CARD_W,ph=22,pr=11;
    // Left pill
    svg.appendChild(mkR(lx,8,pw,ph,{rx:pr,fill:"#f0f0f5"}));
    svg.appendChild(mkT(lx+pw/2,19,RSHORT[ci],{"text-anchor":"middle","font-size":"11","font-weight":"700","fill":"#6e6e73"}));
    // Right pill
    svg.appendChild(mkR(rx,8,pw,ph,{rx:pr,fill:"#f0f0f5"}));
    svg.appendChild(mkT(rx+pw/2,19,RSHORT[ci],{"text-anchor":"middle","font-size":"11","font-weight":"700","fill":"#6e6e73"}));
  });
  // Final label
  svg.appendChild(mkR(finalX,8,CARD_W,22,{rx:11,fill:"#C8102E"}));
  svg.appendChild(mkT(finalX+CARD_W/2,19,"FINAL",{"text-anchor":"middle","font-size":"11","font-weight":"800","fill":"#fff"}));

  // Connector lines — left side
  ROUNDS_L.forEach((r,ci)=>{
    if(ci>=ROUNDS_L.length-1)return;
    for(let mi=0;mi<r.ids.length;mi+=2){
      const cy1=matchCY(ci,mi,"L"),cy2=matchCY(ci,mi+1,"L"),nextCY=matchCY(ci+1,Math.floor(mi/2),"L");
      const x1=colXL(ci)+CARD_W,x2=colXL(ci+1),midX=x1+COL_GAP/2;
      [mkL(x1,cy1,midX,cy1),mkL(x1,cy2,midX,cy2),mkL(midX,cy1,midX,cy2),mkL(midX,nextCY,x2,nextCY)].forEach(l=>svg.appendChild(l));
    }
  });
  // SF left → Final
  const sfLCY=matchCY(3,0,"L");
  svg.appendChild(mkL(colXL(3)+CARD_W,sfLCY,finalX,sfLCY,"#C8102E","2"));

  // Connector lines — right side
  ROUNDS_R.forEach((r,ci)=>{
    if(ci>=ROUNDS_R.length-1)return;
    for(let mi=0;mi<r.ids.length;mi+=2){
      const cy1=matchCY(ci,mi,"R"),cy2=matchCY(ci,mi+1,"R"),nextCY=matchCY(ci+1,Math.floor(mi/2),"R");
      const x1=colXR(ci),x2=colXR(ci+1)+CARD_W,midX=x1-COL_GAP/2;
      [mkL(x1,cy1,midX,cy1),mkL(x1,cy2,midX,cy2),mkL(midX,cy1,midX,cy2),mkL(midX,nextCY,x2,nextCY)].forEach(l=>svg.appendChild(l));
    }
  });
  // SF right → Final
  const sfRCY=matchCY(3,0,"R");
  svg.appendChild(mkL(colXR(3),sfRCY,finalX+CARD_W,sfRCY,"#C8102E","2"));

  function drawCard(x,cy,fxId){
    const d=S.koRes[fxId]||{};
    const h=d.home||null,a=d.away||null,sc=d.score||null,w=d.winner||null;
    const hLocked=!!d.homeLocked,aLocked=!!d.awayLocked;
    const hWon=w&&w===h,aWon=w&&w===a;
    const hk=h?kit(h):{p:"#e5e5e7"},ak=a?kit(a):{p:"#e5e5e7"};
    const y=cy-CARD_H/2,rH=CARD_H/2;
    const bothKnown=h&&a,bothLocked=bothKnown&&hLocked&&aLocked;
    const stroke=sc?"#C8102E":bothLocked?"#16a34a":bothKnown?"#f59e0b":"#ddd";
    const strokeW=bothKnown?"2":"1";

    // Card shadow effect (subtle rect behind)
    svg.appendChild(mkR(x+2,y+2,CARD_W,CARD_H,{rx:"8",fill:"rgba(0,0,0,0.06)"}));
    // Card bg
    svg.appendChild(mkR(x,y,CARD_W,CARD_H,{rx:"8",fill:"#fff",stroke,"stroke-width":strokeW}));
    // Kit strips — top 4px, split
    svg.appendChild(mkR(x,y,CARD_W/2,4,{rx:"0",fill:hk.p}));
    svg.appendChild(mkR(x+CARD_W/2,y,CARD_W/2,4,{fill:ak.p}));
    // Round top corners of strip to match card
    svg.appendChild(mkR(x,y,8,4,{fill:hk.p}));
    svg.appendChild(mkR(x+CARD_W-8,y,8,4,{fill:ak.p}));
    // Divider
    svg.appendChild(mkL(x+8,y+rH,x+CARD_W-8,y+rH,"#f0f0f0","1"));

    // Score column width
    const scoreW=sc?28:18;
    const textW=CARD_W-scoreW-10;

    // Home row
    const hTxt=h?(fl(h)+" "+h):"TBD";
    const hFill=sc?(hWon?"#C8102E":"#aaa"):h?(hLocked?"#1a1a1a":"#b45309"):"#bbb";
    const hFw=hWon?"800":h?"500":"400";
    svg.appendChild(mkT(x+8,y+rH*0.5,hTxt,{"font-size":"12","fill":hFill,"font-weight":hFw,"dominant-baseline":"central","text-anchor":"start"}));
    if(sc){
      const p=sc.split("(")[0].trim().split("-");
      svg.appendChild(mkR(x+CARD_W-scoreW-2,y+4,scoreW,rH-4,{fill:hWon?"rgba(200,16,46,0.08)":"transparent"}));
      svg.appendChild(mkT(x+CARD_W-7,y+rH*0.5,p[0]||"",{"font-size":"15","fill":hWon?"#C8102E":"#888","font-weight":"800","dominant-baseline":"central","text-anchor":"end"}));
    } else if(h){
      const icon=hLocked?"✓":"~";
      svg.appendChild(mkT(x+CARD_W-7,y+rH*0.5,icon,{"font-size":"11","fill":hLocked?"#16a34a":"#f59e0b","font-weight":"700","dominant-baseline":"central","text-anchor":"end"}));
    }

    // Away row
    const aTxtRaw=a?(fl(a)+" "+a):(d.thirdSlot?"3rd "+d.thirdSlot:"TBD");
    const aTxt=aTxtRaw.length>22?aTxtRaw.slice(0,21)+"…":aTxtRaw;
    const aFill=sc?(aWon?"#C8102E":"#aaa"):a?(aLocked?"#1a1a1a":"#b45309"):d.thirdSlot?"#c084fc":"#bbb";
    const aFw=aWon?"800":a?"500":"400";
    svg.appendChild(mkT(x+8,y+rH+rH*0.5,aTxt,{"font-size":"12","fill":aFill,"font-weight":aFw,"dominant-baseline":"central","text-anchor":"start"}));
    if(sc){
      const p=sc.split("(")[0].trim().split("-");
      svg.appendChild(mkR(x+CARD_W-scoreW-2,y+rH,scoreW,rH-4,{fill:aWon?"rgba(200,16,46,0.08)":"transparent"}));
      svg.appendChild(mkT(x+CARD_W-7,y+rH+rH*0.5,p[1]?p[1].trim():"",{"font-size":"15","fill":aWon?"#C8102E":"#888","font-weight":"800","dominant-baseline":"central","text-anchor":"end"}));
    } else if(a){
      const icon=aLocked?"✓":"~";
      svg.appendChild(mkT(x+CARD_W-7,y+rH+rH*0.5,icon,{"font-size":"11","fill":aLocked?"#16a34a":"#f59e0b","font-weight":"700","dominant-baseline":"central","text-anchor":"end"}));
    }
  }

  // Draw all cards
  ROUNDS_L.forEach((r,ci)=>r.ids.forEach((id,mi)=>drawCard(colXL(ci),matchCY(ci,mi,"L"),id)));
  ROUNDS_R.forEach((r,ci)=>r.ids.forEach((id,mi)=>drawCard(colXR(ci),matchCY(ci,mi,"R"),id)));

  outer.appendChild(svg);

}

const ALIASES={"Czech Republic":"Czechia","Türkiye":"Turkiye","Turkey":"Turkiye","Korea Republic":"South Korea","Korea Rep.":"South Korea","United States":"USA","Cabo Verde":"Cape Verde","Congo DR":"DR Congo","Democratic Republic of Congo":"DR Congo","Bosnia-Herzegovina":"Bosnia & Herz.","Bosnia & Herzegovina":"Bosnia & Herz.","Curaçao":"Curacao","Côte d'Ivoire":"Ivory Coast","IR Iran":"Iran"};
const normTeam=n=>{if(!n)return"";const t=n.trim();return ALIASES[t]||t;};

let autoFetchTimer=null;
async function doFetchResults(){
  setState({adminFetching:true,adminFetchLog:"Fetching..."});
  const stamp=new Date().toLocaleTimeString();
  try{
    const gRes=await fetch("https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup.json");
    if(!gRes.ok)throw new Error("Group feed HTTP "+gRes.status);
    const gData=await gRes.json();
    let kData=null;
    try{const kRes=await fetch("https://raw.githubusercontent.com/openfootball/worldcup.json/master/2026/worldcup_finals.json");if(kRes.ok)kData=await kRes.json();}catch(e){}
    const updated={...S.results};let updatedKo={...S.koRes},count=0,koCount=0,changed=0;
    const KRM={"Round of 32":"Round of 32","Round of 16":"Round of 16","Quarter-final":"Quarter-finals","Quarter-finals":"Quarter-finals","Semi-final":"Semi-finals","Semi-finals":"Semi-finals","Final":"Final"};
    (gData?.matches||[]).forEach(am=>{
      const t1=normTeam(am.team1),t2=normTeam(am.team2),score=am.score;
      if(!score?.ft||score.ft.length<2)return;
      let hg=score.ft[0],ag=score.ft[1];if(hg==null||ag==null)return;
      let found=null;
      for(const m of ALL_MATCHES){if(m.home===t1&&m.away===t2){found=m;break;}if(m.home===t2&&m.away===t1){found=m;[hg,ag]=[ag,hg];break;}}
      if(!found)return;
      const prev=updated[found.id];
      if(!prev||prev.home!==String(hg)||prev.away!==String(ag))changed++;
      updated[found.id]={home:String(hg),away:String(ag)};count++;
    });
    if(kData)(kData.matches||[]).forEach(am=>{
      const mr=KRM[am.round||""];if(!mr)return;
      const t1=normTeam(am.team1),t2=normTeam(am.team2);if(!t1||!t2)return;
      const score=am.score,hasScore=score?.ft?.length>=2;
      const hg=hasScore?score.ft[0]:null,ag=hasScore?score.ft[1]:null;
      let winner=null;
      if(hasScore&&hg!==null){if(hg>ag)winner=t1;else if(ag>hg)winner=t2;else if(score.pen){winner=score.pen[0]>score.pen[1]?t1:t2;}}
      let penWinner=null;
      if(score?.pen){penWinner=score.pen[0]>score.pen[1]?t1:t2;}
      let key=null;for(const k of Object.keys(updatedKo)){const m=updatedKo[k];if((m.home===t1&&m.away===t2)||(m.home===t2&&m.away===t1)){key=k;break;}}
      if(!key)key=mr.replace(/ /g,"_")+"_"+Date.now()+"_"+koCount;
      let scoreStr=hasScore?(hg+"-"+ag):null;if(score?.pen)scoreStr+=" ("+score.pen[0]+"-"+score.pen[1]+" pen)";
      const prev=updatedKo[key];
      if(!prev||prev.score!==scoreStr||prev.winner!==winner||prev.penWinner!==penWinner)changed++;
      updatedKo[key]={home:t1,away:t2,winner,score:scoreStr,penWinner};koCount++;
    });
    const summary=`${stamp} — ✅ ${count} group${koCount>0?`, ${koCount} KO`:""} result${(count+koCount)===1?"":"s"} found${changed>0?`, ${changed} new`:" (no changes)"}`;
    if(changed>0){
      const parts=[];
      const gChanged=countChangedKeys(S.results,updated),kChanged=countChangedKeys(S.koRes,updatedKo);
      if(gChanged>0)parts.push(gChanged+" group result"+(gChanged===1?"":"s"));
      if(kChanged>0)parts.push(kChanged+" KO result"+(kChanged===1?"":"s"));
      S.results=updated;S.koRes=updatedKo;snapshotRanksIfChanged(parts.join(" + "));
    } else {S.results=updated;S.koRes=updatedKo;}
    setState({results:updated,koRes:updatedKo,adminFetching:false,adminFetchLog:summary});
    if(changed>0){await Promise.all([sSet(SK.results,updated),sSet(SK.koResults,updatedKo)]);notify(changed+" result"+(changed===1?"":"s")+" updated","⚡");}
    await deriveAndSaveR32();
    await propagateKoBracket();
  }catch(e){setState({adminFetching:false,adminFetchLog:`${stamp} — ❌ Fetch failed: ${e.message||e}`});}
}
